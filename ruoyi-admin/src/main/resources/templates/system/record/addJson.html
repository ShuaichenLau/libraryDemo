<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增JSON对比数据源')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-type-add">

            <div class="form-group">
                <label class="col-sm-3 control-label">clustag：</label>
                <div class="col-sm-8">
                    <select id="clustag" name="clustag" class="form-control select2-multiple" >
                        <option th:each="post:${clustag}" th:value="${post.dictValue}" th:text="${post.dictValue}" ></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">baggage：</label>
                <div class="col-sm-8">
                    <select id="baggage" name="baggage" class="form-control select2-multiple" >
                        <option th:each="post:${baggage}" th:value="${post.dictValue}" th:text="${post.dictValue}" ></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">accountId：</label>
                <div class="col-sm-8">
                    <input name="accountId" class="form-control" type="text">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">authorization：</label>
                <div class="col-sm-8">
                    <input name="authorization" class="form-control" type="text">
                </div>
            </div>

        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/record"
        $("#form-type-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/addJson", $('#form-type-add').serialize());
            }
        }

        $("input[name='createTime']").datetimepicker({
            format: "yyyy-MM-dd HH:mm:ss",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
